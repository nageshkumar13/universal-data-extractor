name: CI

on:
  push:
    branches: [main, dev/next-steps]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Install Chromium on Ubuntu
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Smoke-test Chromium without network
        shell: python
        run: |
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              try:
                  page = browser.new_page()
                  try:
                      page.set_content("<main><h1>Chromium is ready</h1></main>")
                      assert page.locator("h1").inner_text() == "Chromium is ready"
                  finally:
                      page.close()
              finally:
                  browser.close()

      - name: Run tests
        run: python -m pytest -q
